<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="40" fill="url(#bg)" stroke="#1e293b" stroke-width="4"/>
  <!-- Institutional Shield & Chart Line -->
  <g transform="translate(46, 36)">
    <!-- Shield -->
    <path d="M50 0 L90 20 C90 65 50 95 50 100 C50 95 10 65 10 20 Z" fill="none" stroke="url(#shieldGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- Institutional Pillar / Aladdin Grid -->
    <path d="M35 38 L35 72 M50 30 L50 78 M65 38 L65 72" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="4" fill="#10b981"/>
  </g>
  <text x="96" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="2">ASUP ALADDIN</text>
  <text x="96" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#10b981" text-anchor="middle" letter-spacing="1">VANGUARD STANDARD</text>
</svg>