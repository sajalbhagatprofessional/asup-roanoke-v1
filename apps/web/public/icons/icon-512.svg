<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shieldGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="40%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="100" fill="url(#bg512)" stroke="#1e293b" stroke-width="8"/>
  <!-- Institutional Shield & Chart Line -->
  <g transform="translate(136, 96)">
    <!-- Shield -->
    <path d="M120 0 L220 50 C220 160 120 230 120 245 C120 230 20 160 20 50 Z" fill="none" stroke="url(#shieldGrad512)" stroke-width="14" stroke-linejoin="round" filter="url(#glow512)"/>
    <!-- Institutional Pillars / Aladdin Waterfall -->
    <path d="M80 90 L80 170 M120 70 L120 190 M160 90 L160 170" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    <!-- Check & Dot -->
    <circle cx="120" cy="120" r="10" fill="#10b981"/>
  </g>
  <text x="256" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">ASUP ALADDIN</text>
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="3">VANGUARD PLATFORM v1.0</text>
</svg>